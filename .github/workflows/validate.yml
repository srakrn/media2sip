name: validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  versions:
    name: versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Catch drift on every push, not at release time when it is inconvenient.
      - run: ./scripts/versions.sh

  hassfest:
    name: hassfest (integration manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # `brands` only matters for inclusion in the HACS default store, which
          # needs a merged PR to home-assistant/brands. This is installed as a
          # custom repository, where it is not required - the integration just
          # shows a default icon.
          ignore: brands

  addon:
    name: add-on config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./media2sip_sidecar
