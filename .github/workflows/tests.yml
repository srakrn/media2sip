name: tests

on:
  push:
  pull_request:

jobs:
  integration:
    name: integration (mocked sidecar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install "pytest-homeassistant-custom-component==0.13.346"
      - run: python -m pytest tests/

  sidecar:
    name: sidecar unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t media2sip:latest sidecar/
      - run: docker build -f sidecar/Dockerfile.test -t media2sip:test sidecar/
      - run: docker run --rm media2sip:test

  e2e:
    name: end-to-end (real Asterisk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest
      - run: docker build -t media2sip:latest sidecar/
      - name: run the suite
        run: PYTEST="python -m pytest" ./sidecar/tests/integration/run.sh
