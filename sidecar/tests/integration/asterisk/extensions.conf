[paging]
; `q` suppresses the beep prompt Record plays by default (the image ships no
; prompt files); `k` keeps the recording when the caller hangs up, which is
; exactly how a page ends.
; Stands in for a page group: answers immediately, with no ringing, exactly as
; the real one was measured to do in phase 1. Records what it hears so a test can
; assert that audio actually arrived rather than that a call merely connected.
exten => 991,1,Answer()
 same => n,Record(/recordings/page:wav,0,30,qk)
 same => n,Hangup()

; Always busy, for exercising the 486 path.
exten => 992,1,Busy()
 same => n,Hangup()

; Rings but never answers, for the answer-timeout path.
exten => 993,1,Ringing()
 same => n,Wait(60)
 same => n,Hangup()
