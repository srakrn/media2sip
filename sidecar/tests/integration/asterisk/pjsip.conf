; Minimal registrar standing in for the PBX. Nothing FreePBX-specific, which is
; the point: the sidecar depends on SIP, not on a particular PBX.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[9901]
type=endpoint
context=paging
disallow=all
allow=ulaw
allow=alaw
auth=9901
aors=9901
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[9901]
type=auth
auth_type=userpass
username=9901
password=test-secret

[9901]
type=aor
max_contacts=1
remove_existing=yes
